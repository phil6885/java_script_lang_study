<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title></title>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const star = document.querySelector('h1')
            star.style.position = 'absolute'

            let [x, y] = [0, 0]
            const block = 20

            const print = () => {
                star.style.left = `${x * block}px`
                star.style.top = `${y * block}px`
            }
            print()

            document.body.addEventListener('keydown', (event) => {
                switch (event.key) {
                    case 'ArrowDown':
                        y += 1
                        break
                    case 'ArrowUp':
                        y -= 1
                        break
                    case 'ArrowLeft':
                        x -= 1
                        break
                    case 'ArrowRight':
                        x += 1
                        break
                }
                print()
            })
        })
    </script>
</head>
<body>
    <h1>⭐️</h1>
</body>
</html>
